services:
  - type: web
    name: zhiyuan-libretv
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: "8080"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PASSWORD
        sync: false
      - key: PROXY_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
